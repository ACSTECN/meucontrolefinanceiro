{% extends "base.html" %}
{% block content %}
<section>
  <header class="flex flex-wrap items-end justify-between gap-3 mb-6">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Lançamentos</h2>
      <p class="text-sm text-slate-500 mt-0.5">Histórico completo de receitas e despesas.</p>
    </div>
    <a href="/novo" class="btn btn-primary">+ Novo Lançamento</a>
  </header>

  <section class="card p-4 sm:p-5 mb-6 no-print">
    <h3 class="text-sm font-semibold text-slate-700 mb-3">Filtros</h3>
    <form id="filterForm" class="filters-row">
      <div>
        <label class="label" for="f_mes">Mês</label>
        <select id="f_mes" class="field"></select>
      </div>
      <div>
        <label class="label" for="f_ano">Ano</label>
        <select id="f_ano" class="field"></select>
      </div>
      <div>
        <label class="label" for="f_start">Data inicial</label>
        <input id="f_start" type="date" class="field" />
      </div>
      <div>
        <label class="label" for="f_end">Data final</label>
        <input id="f_end" type="date" class="field" />
      </div>
      <div>
        <label class="label" for="f_type">Tipo</label>
        <select id="f_type" class="field">
          <option value="">Todos</option>
          <option value="RECEITA">Receitas</option>
          <option value="DESPESA">Despesas</option>
        </select>
      </div>
      <div>
        <label class="label" for="f_cat">Categoria</label>
        <select id="f_cat" class="field"><option value="">Todas</option></select>
      </div>
      <div>
        <label class="label" for="f_pag">Forma de pagamento</label>
        <select id="f_pag" class="field">
          <option value="">Todas</option>
          <option>PIX</option>
          <option>Dinheiro</option>
          <option>Débito</option>
          <option>Cartão de crédito</option>
          <option>Transferência</option>
          <option>Boleto</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="sm:col-span-2 md:col-span-1 lg:col-span-2 flex items-end gap-2">
        <button type="submit" class="btn btn-primary w-full sm:w-auto">Aplicar</button>
        <button type="reset" id="btnReset" class="btn btn-ghost w-full sm:w-auto">Limpar</button>
      </div>
    </form>
  </section>

  <div id="summaryBar" class="mb-4 grid gap-3 sm:grid-cols-3">
    <div class="skeleton h-12"></div>
    <div class="skeleton h-12"></div>
    <div class="skeleton h-12"></div>
  </div>

  <section class="card overflow-hidden">
    <div class="hidden md:block overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-slate-600">Data</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-600">Descrição</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-600">Categoria</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-600">Tipo</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-600">Forma pgto</th>
            <th class="px-4 py-3 text-right font-semibold text-slate-600">Valor</th>
            <th class="px-4 py-3 text-right font-semibold text-slate-600 no-print">Ações</th>
          </tr>
        </thead>
        <tbody id="txTbody" class="divide-y divide-slate-100">
          <tr><td colspan="7" class="px-4 py-10 text-center text-slate-500">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="txCards" class="md:hidden p-3"></div>
  </section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/lancamentos.js"></script>
{% endblock %}
